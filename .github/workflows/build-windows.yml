name: Build Windows app

# Builds the Windows app (ClaudeMultiAccountLauncher.exe) from source, adds
# Microsoft's WebView2 files from NuGet, and publishes the zip on the Releases
# page as v<version> (version taken from src/app.rc).

on:
  push:
    branches: [main]
    paths: ['src/**', 'assets/**', 'build.sh', 'packaging/**', '.github/workflows/build-windows.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  WEBVIEW2_VERSION: 1.0.3856.49

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools (Mono and LLVM)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mono-devel llvm zip
          echo "$(ls -d /usr/lib/llvm-*/bin | sort -V | tail -1)" >> "$GITHUB_PATH"

      - name: Get Microsoft WebView2 SDK from NuGet
        run: |
          set -e
          curl -sSL -o wv2.nupkg "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/$WEBVIEW2_VERSION"
          mkdir wv2 && unzip -q wv2.nupkg -d wv2
          libdir=$(dirname "$(ls wv2/lib/net4*/Microsoft.Web.WebView2.Core.dll | sort -V | tail -1)")
          mkdir -p lib
          cp "$libdir/Microsoft.Web.WebView2.Core.dll" "$libdir/Microsoft.Web.WebView2.WinForms.dll" lib/
          for a in x64 x86 arm64; do
            mkdir -p lib/runtimes/win-$a/native
            cp wv2/runtimes/win-$a/native/WebView2Loader.dll lib/runtimes/win-$a/native/
          done
          sha256sum lib/*.dll lib/runtimes/*/native/*.dll

      - name: Build
        run: sh build.sh

      - name: Package
        id: pkg
        run: |
          set -e
          VER=$(sed -n 's/.*"ProductVersion", "\([0-9]*\.[0-9]*\.[0-9]*\)\.[0-9]*".*/\1/p' src/app.rc)
          SHA=$(sha256sum build/ClaudeMultiAccountLauncher.exe | cut -d' ' -f1)
          file build/ClaudeMultiAccountLauncher.exe
          D="pkg/Claude Multi-Account Launcher"
          mkdir -p "$D"
          cp build/ClaudeMultiAccountLauncher.exe lib/Microsoft.Web.WebView2.Core.dll lib/Microsoft.Web.WebView2.WinForms.dll LICENSE NOTICE.md "$D"/
          cp -r lib/runtimes "$D"/
          sed -e "s/{{VERSION}}/$VER/g" -e "s/{{SHA256}}/$SHA/" packaging/windows-readme.txt | sed 's/$/\r/' > "$D/Read me first.txt"
          ZIP="ClaudeMultiAccountLauncher-$VER-windows.zip"
          (cd pkg && zip -qr "../$ZIP" "Claude Multi-Account Launcher")
          unzip -l "$ZIP"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: ${{ steps.pkg.outputs.zip }}

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Claude Multi-Account Launcher for Windows v${{ steps.pkg.outputs.version }}
          overwrite_files: true
          make_latest: 'true'
          files: ${{ steps.pkg.outputs.zip }}
          body: |
            Claude Multi-Account Launcher for Windows, by Gerizon Technologies.

            **Install:** download `${{ steps.pkg.outputs.zip }}`, unzip the whole folder somewhere it will stay (such as Documents), then run `ClaudeMultiAccountLauncher.exe`.

            This release isn't code-signed yet. If Windows shows "Windows protected your PC", click **More info**, then **Run anyway**.

            Requires Windows 10 or 11 with the Microsoft Edge WebView2 Runtime (built into Windows 11 and most Windows 10 PCs).

            SHA-256 of ClaudeMultiAccountLauncher.exe: `${{ steps.pkg.outputs.sha }}`

            Looking for the Mac version? See the "for Mac" releases.
